name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [server, client]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Is this workspace present yet?
        id: check
        run: |
          if [ -f "${{ matrix.workspace }}/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::${{ matrix.workspace }}/package.json does not exist yet (created by US-01)."
          fi

      - name: Set up Node.js
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check.outputs.present == 'true'
        working-directory: ${{ matrix.workspace }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        if: steps.check.outputs.present == 'true'
        working-directory: ${{ matrix.workspace }}
        run: npm run lint --if-present

      - name: Test
        if: steps.check.outputs.present == 'true'
        working-directory: ${{ matrix.workspace }}
        run: npm test --if-present
